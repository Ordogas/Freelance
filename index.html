  const projects = S.projects.filter((p) => p.status === "active" || p.id === pid);
  if (!projects.length) { toast("Create a project first, then log time to it."); return; }
  const opts = projects.map((p) => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)}${clientOf(p) ? " · " + esc(clientOf(p).name) : ""}</option>`).join("");
  openModal(`<form id="lt-form" style="display:grid;gap:14px">
    <h2>Log time</h2>
    <label class="field"><span>Project</span><select class="input" name="project_id" id="ltm-project" required>${opts}</select></label>
    <div class="grid3">
      <label class="field"><span>Date</span><input class="input" type="date" name="date" id="ltm-date" value="${today()}" required></label>
      <label class="field"><span>Hours</span><input class="input" name="hours" id="ltm-hours" inputmode="decimal" placeholder="3.5" required></label>
      <label class="field"><span>Task</span><select class="input" name="task_id" id="ltm-task"></select></label>
    </div>
    <label class="field"><span>Note</span><input class="input" name="note" id="ltm-note" placeholder="What you worked on"></label>
    <label class="check"><input type="checkbox" name="billable" checked> Billable</label>
    <div class="foot"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Log time</button></div>
  </form>`, (w) => {
    const ps = w.querySelector("#ltm-project"), ts = w.querySelector("#ltm-task");
    const fill = () => { ts.innerHTML = `<option value="">No task</option>` + S.tasks.filter((t) => t.project_id === ps.value && t.status !== "done").map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join(""); };
    ps.addEventListener("change", fill); fill();
    w.querySelector("#ltm-hours").focus();
  });
}

/* ===================== actions ===================== */
function parseHours(v) {
  const s = String(v || "").trim().replace(",", ".");
  if (!s) return 0;
  const m = s.match(/^(\d+):(\d{1,2})$/); // 1:30
  if (m) return +m[1] + +m[2] / 60;
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

const actions = {
  view(el) { S.view = el.dataset.v; store.set("view", S.view); render(); window.scrollTo(0, 0); },
  open(el) { S.open = el.dataset.id; if (el.dataset.sub) S.sub = el.dataset.sub; S.editSteps = false; renderSheet(); },
  "close-sheet"() { S.open = null; S.editSteps = false; renderSheet(); },
  "open-review"() { S.review = true; S.open = null; renderSheet(); },
  "close-review"() { S.review = false; renderSheet(); },
  "sg-toggle"(el) { el.closest(".op")?.classList.toggle("off", !el.checked); },
  async "sg-accept"(el) {
    const s = S.suggestions.find((x) => x.id === el.dataset.id); if (!s) return;
    el.disabled = true;
    try { await acceptSuggestion(s); await resolveSuggestion(s.id, "accepted"); toast("Added to the tracker"); }
    catch (e) { el.disabled = false; render(); }
  },
  async "sg-dismiss"(el) { el.disabled = true; try { await resolveSuggestion(el.dataset.id, "dismissed"); } catch { el.disabled = false; } },
  "close-modal"() { closeModal(); },
  "new-project"() { newProjectModal(); },
  "new-client"() { newClientModal(); },
  "log-time"() { logTimeModal(S.open); },
  sub(el) { S.sub = el.dataset.v; store.set("sub", S.sub); renderSheet(); },
  "edit-steps"() { S.editSteps = !S.editSteps; renderSheet(); },
  async "set-stage"(el) { const p = projectOf(S.open); if (p.stage !== el.dataset.stage) await save("projects", { id: p.id, stage: el.dataset.stage }); },
  async "toggle-skip"(el) {
    const p = projectOf(S.open), k = el.dataset.stage;
    if (k === "brief" || k === "paid") { toast("Brief and Paid are part of every job."); return; }
    if (k === p.stage) { toast("Move the project off this stage before skipping it."); return; }
    const sk = new Set(p.skipped_stages || []); sk.has(k) ? sk.delete(k) : sk.add(k);
    await save("projects", { id: p.id, skipped_stages: [...sk] });
  },
  async advance(el) {
    const p = projectOf(el.dataset.id), n = nextStage(p, +(el.dataset.dir || 1));
    if (n) { await save("projects", { id: p.id, stage: n }); toast(`${p.name} → ${STAGES[STAGE_IDX[n]].label}`); }
  },
  async "cycle-task"(el) {
    const t = S.tasks.find((x) => x.id === el.dataset.id);
    await save("tasks", { id: t.id, status: TASK_STATUS[(TASK_STATUS.indexOf(t.status) + 1) % 4] });
  },
  async "del-task"(el) { await remove("tasks", el.dataset.id); },
  async "del-time"(el) { await remove("time_entries", el.dataset.id); },
  async "del-pay"(el) { await remove("payments", el.dataset.id); },
  async "toggle-billable"(el) { await save("time_entries", { id: el.dataset.id, billable: el.checked }); },
  async schedule(el) {
    const p = projectOf(S.open), m = moneyOf(p), parts = +el.dataset.parts;
    const each = Math.floor((m.unscheduled / parts) * 100) / 100;
    const labels = parts === 1 ? ["Payment"] : parts === 2 ? ["Deposit", "Final"] : ["Part 1", "Part 2", "Final"];
    for (let i = 0; i < parts; i++) {
      const amt = i === parts - 1 ? Math.round((m.unscheduled - each * (parts - 1)) * 100) / 100 : each;
      await save("payments", { project_id: p.id, label: labels[i], amount: amt, status: "expected" }, { quiet: true });
    }
    render();
  },
  async "del-project"(el) {
    if (!el.classList.contains("confirm")) { el.classList.add("confirm"); el.textContent = "Delete project, its tasks, time and payments"; return; }
    const id = el.dataset.id; S.open = null; await remove("projects", id); toast("Project deleted");
  },
  async "del-client"(el) {
    if (!el.classList.contains("confirm")) { el.classList.add("confirm"); el.textContent = "Confirm delete"; return; }
    await remove("clients", el.dataset.id); toast("Client deleted. Their projects are kept.");
  },
  async "client-color"(el) { await save("clients", { id: el.dataset.id, color: el.dataset.color }); },
  week(el) { const d = +el.dataset.d; S.week = d === 0 ? mondayOf(today()) : addDays(S.week, d); render(); },
  "money-filter"(el) { S.moneyFilter = el.dataset.v; render(); },
  async "sign-out"() { await sb.auth.signOut(); },
  "login-again"() { S.loginSent = null; render(); },
  async "load-examples"(el) { el.disabled = true; try { await loadExamples(); } finally { el.disabled = false; } },
  async "clear-examples"(el) {
    el.disabled = true;
    try {
      setSync("saving");
      const a = await sb.from("projects").delete().eq("example", true);
      const b = await sb.from("clients").delete().eq("example", true);
      if (a.error || b.error) throw a.error || b.error;
      await loadAll(); toast("Examples removed");
    } catch (e) { setSync("error"); toast("Couldn't remove examples: " + e.message, "bad"); el.disabled = false; }
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.tagName === "INPUT" && el.type === "checkbox" && el.dataset.act === "toggle-billable") return; // handled on change
    if (el.dataset.act === "sg-toggle") { actions["sg-toggle"](el); return; }
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); Promise.resolve(fn(el, e)).catch(() => {}); }
    return;
  }
  const c = e.target.closest("[data-card]");
  if (c) { S.open = c.dataset.card; S.editSteps = false; renderSheet(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#modal-wrap")) closeModal(); else if (S.review) { S.review = false; renderSheet(); } else if (S.open) { S.open = null; renderSheet(); } }
  if (e.key === "Enter" && e.target.matches("[data-card]")) { S.open = e.target.dataset.card; renderSheet(); }
  if (e.key === "Enter" && e.target.matches("input[data-ts], input[data-tfield], input[data-yfield], input[data-cfield]")) e.target.blur();
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  try {
    if (el.dataset.act === "toggle-billable") return actions["toggle-billable"](el);
    if (el.dataset.filter) {
      S.filter[el.dataset.filter] = el.type === "checkbox" ? el.checked : el.value;
      store.set("filter", S.filter); render(); return;
    }
    if (el.dataset.tfield) {
      const v = el.dataset.tfield === "tags" ? parseTags(el.value) : el.value.trim();
      if (el.dataset.tfield === "name" && !v) { render(); return; }
      return await save("tasks", { id: el.dataset.id, [el.dataset.tfield]: v });
    }
    if (el.dataset.yfield) {
      const f = el.dataset.yfield; let v = el.value;
      const rec = { id: el.dataset.id };
      if (f === "amount") { v = numOrNull(v); if (v == null || !Number.isFinite(v)) { toast("Enter an amount in euros, e.g. 600", "bad"); render(); return; } }
      else v = orNull(v.trim ? v.trim() : v);
      rec[f] = v;
      if (f === "status" && v === "received") { const y = S.payments.find((x) => x.id === el.dataset.id); if (!y.paid_date) rec.paid_date = today(); }
      return await save("payments", rec);
    }
    if (el.dataset.cfield) {
      const f = el.dataset.cfield; let v = el.value.trim();
      if (f === "name" && !v) { render(); return; }
      if (f === "default_rate") v = numOrNull(v); else if (f !== "color") v = orNull(v);
      return await save("clients", { id: el.dataset.id, [f]: v });
    }
    if (el.dataset.pfield === "name") {
      const v = el.value.trim(); if (!v) { renderSheet(); return; }
      return await save("projects", { id: S.open, name: v });
    }
    if (el.dataset.ts) return await saveCell(el);
    if (el.id === "ts-add" && el.value) {
      const rows = store.get("weekRows", []); rows.push(el.value); store.set("weekRows", [...new Set(rows)]); render(); return;
    }
  } catch (err) { /* toast already shown */ }
});

async function saveCell(el) {
  const pid = el.dataset.ts, date = el.dataset.date;
  const h = parseHours(el.value);
  if (Number.isNaN(h) || h < 0 || h > 24) { toast("Hours should be a number between 0 and 24, like 2.5 or 2:30", "bad"); el.value = ""; return; }
  const existing = S.time_entries.find((e) => e.project_id === pid && e.date === date);
  try {
    if (!h && existing) await remove("time_entries", existing.id, { quiet: true });
    else if (h && existing) { if (num(existing.hours) !== h) await save("time_entries", { id: existing.id, hours: h }, { quiet: true }); }
    else if (h) await save("time_entries", { project_id: pid, date, hours: h, billable: true }, { quiet: true });
    el.value = h ? +h.toFixed(2) : "";
    refreshWeekTotals();
  } catch {}
}

document.addEventListener("input", (e) => {
  if (e.target.dataset.filter === "q") {
    S.filter.q = e.target.value; store.set("filter", S.filter);
    clearTimeout(window.__qt); window.__qt = setTimeout(render, 180);
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f);
  const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (f.id === "login-form") {
      const email = fd.get("email") || $("#login-email").value;
      S.loginError = null;
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) {
        S.loginError = /database error|sign-?ups/i.test(error.message) ? "This tracker already has an owner. Sign in with the owner's email." : error.message;
      } else S.loginSent = email;
      render(); return;
    }
    if (f.id === "add-task") {
      const name = fd.get("name").trim(); if (!name) return;
      const max = Math.max(0, ...S.tasks.filter((t) => t.project_id === S.open).map((t) => t.position));
      await save("tasks", { project_id: S.open, name, tags: parseTags(fd.get("tags")), position: max + 1 });
      $("#nt-name")?.focus(); if ($("#nt-name")) $("#nt-name").value = ""; if ($("#nt-tags")) $("#nt-tags").value = "";
      return;
    }
    if (f.id === "add-time" || f.id === "lt-form") {
      const h = parseHours(fd.get("hours"));
      if (!h || Number.isNaN(h) || h > 24) { toast("Hours should be a number between 0 and 24, like 2.5 or 2:30", "bad"); return; }
      await save("time_entries", {
        project_id: fd.get("project_id") || S.open, date: fd.get("date"), hours: h,
        task_id: orNull(fd.get("task_id")), note: orNull((fd.get("note") || "").trim()), billable: fd.get("billable") === "on",
      });
      if (f.id === "lt-form") { closeModal(); toast(`Logged ${hrs(h)}`); } else { $("#nte-hours").value = ""; $("#nte-note").value = ""; $("#nte-hours").focus(); }
      return;
    }
    if (f.id === "add-pay") {
      const amount = numOrNull(fd.get("amount"));
      if (amount == null || !Number.isFinite(amount)) { toast("Enter an amount in euros, e.g. 600", "bad"); return; }
      const status = fd.get("status");
      await save("payments", { project_id: S.open, label: orNull(fd.get("label").trim()), amount, status, due_date: orNull(fd.get("due_date")), paid_date: status === "received" ? today() : null });
      return;
    }
    if (f.id === "details") {
      const rec = {
        id: S.open, client_id: orNull(fd.get("client_id")), status: fd.get("status"), billing_mode: fd.get("billing_mode"),
        rate: numOrNull(fd.get("rate")), fixed_fee: numOrNull(fd.get("fixed_fee")), included_hours: numOrNull(fd.get("included_hours")),
        start_date: orNull(fd.get("start_date")), due_date: orNull(fd.get("due_date")), tags: parseTags(fd.get("tags")), description: orNull(fd.get("description")),
      };
      for (const k of ["rate", "fixed_fee", "included_hours"]) if (rec[k] != null && !Number.isFinite(rec[k])) { toast("Rates, fees and hours should be plain numbers, like 45 or 1200", "bad"); return; }
      await save("projects", rec); toast("Details saved"); return;
    }
    if (f.id === "nc-form") {
      const rate = numOrNull(fd.get("default_rate"));
      await save("clients", { name: fd.get("name").trim(), color: fd.get("color"), default_rate: Number.isFinite(rate) ? rate : null, email: orNull(fd.get("email").trim()) });
      closeModal(); toast("Client added"); return;
    }
    if (f.id === "np-form") {
      let client_id = orNull(fd.get("client_id"));
      if (client_id === "__new") {
        const nm = (fd.get("new_client") || "").trim();
        if (!nm) { toast("Give the new client a name", "bad"); return; }
        const c = await save("clients", { name: nm, color: COLORS[S.clients.length % COLORS.length] }, { quiet: true });
        client_id = c.id;
      }
      const on = fd.getAll("st");
      const skipped = STAGES.map((s) => s.key).filter((k) => k !== "brief" && k !== "paid" && !on.includes(k));
      const rate = numOrNull(fd.get("rate")), fee = numOrNull(fd.get("fixed_fee"));
      const p = await save("projects", {
        name: fd.get("name").trim(), client_id, billing_mode: fd.get("billing_mode"),
        rate: Number.isFinite(rate) ? rate : null, fixed_fee: Number.isFinite(fee) ? fee : null,
        due_date: orNull(fd.get("due_date")), tags: parseTags(fd.get("tags")), skipped_stages: skipped,
        stage: "brief", start_date: today(),
      });
      closeModal(); S.view = "board"; store.set("view", "board"); S.open = p.id; S.sub = "tasks"; render(); return;
    }
  } catch (err) { /* toast already shown */ }
  finally { if (btn && document.contains(btn)) btn.disabled = false; }
});

/* drag and drop on the rail */
document.addEventListener("dragstart", (e) => {
  const c = e.target.closest?.("[data-card]"); if (!c) return;
  e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging");
});
document.addEventListener("dragend", (e) => { e.target.closest?.("[data-card]")?.classList.remove("dragging"); document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); });
document.addEventListener("dragover", (e) => { const col = e.target.closest?.("[data-drop]"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach((x) => x !== col && x.classList.remove("drop")); col.classList.add("drop"); });
document.addEventListener("drop", async (e) => {
  const col = e.target.closest?.("[data-drop]"); if (!col) return; e.preventDefault(); col.classList.remove("drop");
  const id = e.dataTransfer.getData("text/plain"), p = projectOf(id), stage = col.dataset.drop;
  if (!p || p.stage === stage) return;
  const skipped = (p.skipped_stages || []).filter((k) => k !== stage);
  try { await save("projects", { id, stage, skipped_stages: skipped }); } catch {}
});

/* chart tooltip */
document.addEventListener("mousemove", (e) => {
  const g = e.target.closest?.("[data-tip]");
  let tip = $(".chart-tip");
  if (!g) { if (tip) tip.remove(); return; }
  if (!tip) { tip = document.createElement("div"); tip.className = "chart-tip"; document.body.appendChild(tip); }
  tip.textContent = g.dataset.tip;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = e.clientY - 34 + "px";
});

/* ===================== example data ===================== */
async function loadExamples() {
  const t = today();
  const c1 = await save("clients", { name: "Harbour Coffee Co.", color: "#C2412D", default_rate: 45, example: true, notes: "Example client" }, { quiet: true });
  const c2 = await save("clients", { name: "Pine Coast Hotels", color: "#2F7D6D", default_rate: 50, example: true, notes: "Example client" }, { quiet: true });
  const p1 = await save("projects", { name: "Winter menu photography", client_id: c1.id, stage: "production", billing_mode: "fixed", fixed_fee: 1800, tags: ["content", "photo"], due_date: addDays(t, 9), start_date: addDays(t, -12), example: true }, { quiet: true });
  const p2 = await save("projects", { name: "Website refresh", client_id: c2.id, stage: "review", billing_mode: "fixed_plus", fixed_fee: 2400, included_hours: 40, tags: ["web", "design"], due_date: addDays(t, 3), start_date: addDays(t, -30), example: true }, { quiet: true });
  const p3 = await save("projects", { name: "Autumn campaign ideas", client_id: c2.id, stage: "pitch", billing_mode: "hourly", skipped_stages: ["production", "review", "delivered"], tags: ["creative", "pitch"], start_date: addDays(t, -4), example: true }, { quiet: true });
  const p4 = await save("projects", { name: "Seasonal social posts", client_id: c1.id, stage: "invoiced", billing_mode: "hourly", tags: ["content"], start_date: addDays(t, -40), example: true }, { quiet: true });
  const tasks = [
    [p1, "Shot list", "done", ["planning"]], [p1, "Shoot day", "done", ["photo"]], [p1, "Retouching", "doing", ["photo"]], [p1, "Deliver final files", "todo", []],
    [p2, "Homepage design", "done", ["figma"]], [p2, "Build templates", "done", ["dev"]], [p2, "Client feedback round", "waiting", ["revision"]],
    [p3, "Three concept directions", "doing", ["creative"]], [p3, "Pitch deck", "todo", ["deck"]],
  ];
  const tmap = {};
  let pos = 0;
  for (const [p, name, status, tags] of tasks) tmap[name] = await save("tasks", { project_id: p.id, name, status, tags, position: pos++ }, { quiet: true });
  const time = [
    [p1, -10, 2, "Shot list"], [p1, -7, 7.5, "Shoot day"], [p1, -2, 4, "Retouching"], [p1, -1, 3.5, "Retouching"],
    [p2, -20, 12, "Homepage design"], [p2, -12, 16, "Build templates"], [p2, -5, 9, "Build templates"], [p2, -2, 6, "Client feedback round"],
    [p3, -3, 3, "Three concept directions"], [p3, -1, 2.5, "Three concept directions"], [p3, 0, 1.5, null],
    [p4, -35, 6, null], [p4, -28, 5, null],
  ];
  for (const [p, d, h, task] of time) await save("time_entries", { project_id: p.id, date: addDays(t, d), hours: h, task_id: task ? tmap[task].id : null, billable: p !== p3 || d !== 0, note: null }, { quiet: true });
  const pays = [
    [p1, "Deposit", 900, "received", null, addDays(t, -12)], [p1, "Final", 900, "expected", addDays(t, 14), null],
    [p2, "Deposit", 1200, "received", null, addDays(t, -28)], [p2, "Second part", 800, "invoiced", addDays(t, -2), null],
    [p4, "Invoice", 495, "invoiced", addDays(t, 10), null],
  ];
  for (const [p, label, amount, status, due, paid] of pays) await save("payments", { project_id: p.id, label, amount, status, due_date: due, paid_date: paid, invoice_no: status !== "expected" ? "MP-" + String(100 + Math.floor(Math.random() * 900)) : null }, { quiet: true });
  render();
  toast("Example data loaded");
}

/* ===================== boot ===================== */
render();
sb.auth.onAuthStateChange((event, session) => {
  const was = S.user?.id;
  S.user = session?.user || null;
  if (S.user && S.user.id !== was) { S.loaded = false; render(); loadAll(); }
  else if (!S.user) { S.loaded = false; S.open = null; S.review = false; S.suggestions = []; TABLES.forEach((t) => (S[t] = [])); render(); }
});
